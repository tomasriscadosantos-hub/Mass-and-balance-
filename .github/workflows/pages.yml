# Publishes the web app (web/) to GitHub Pages so it can be installed on a phone.
# Runs when anything in web/ changes on the default branch, or by hand from the
# Actions tab ("Run workflow"). The tests must pass before anything is published.
name: Deploy web app

on:
  push:
    branches: [claude/eager-brahmagupta-cii6jq, main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "web/tests/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the app without its tests
        run: |
          cp -r web _site
          rm -rf _site/tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
