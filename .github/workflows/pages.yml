# Publishes the web app (web/) to GitHub Pages so it can be installed on a phone,
# together with the latest METARs, TAFs and IPMA aerodrome station data (weather.json).
#
# Runs when anything in web/ changes on the default branch, every 15 minutes to
# refresh the weather, or by hand from the Actions tab ("Run workflow").
# The tests must pass before a change to the app is published.
name: Deploy web app

on:
  push:
    branches: [claude/eager-brahmagupta-cii6jq, main]
    paths: ["web/**", ".github/scripts/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "4,19,34,49 * * * *" # IPMA stations every 10 min, METARs every 30
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'schedule' # the weather refresh doesn't change the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "web/tests/*.test.js"

  build:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the app without its tests
        run: |
          cp -r web _site
          rm -rf _site/tests _site/weather.json
      - name: Download METARs, TAFs and IPMA station data
        run: node .github/scripts/fetch-weather.js _site/weather.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A job of its own: deploying in the same job as the upload sometimes
  # fails with "No artifacts named github-pages" because the upload isn't
  # visible yet.
  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
